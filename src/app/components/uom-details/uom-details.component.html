<app-subheader [title]="title" (onRefresh)="onRefresh()">
    <ng-container head>
        <ui5-button
            [icon]="editIcon"
            (click)="onEdit()"
            *ngIf="!editingEnabled"
        >
            Edit
        </ui5-button>
        <ui5-button
            design="Negative"
            [icon]="editIcon"
            (click)="onEdit()"
            *ngIf="editingEnabled"
        >
            Cancel Editing
        </ui5-button>
    </ng-container>
</app-subheader>

<div class="container">
    <div id="summary">
        <!-- have to change later -->
        <span class="summary-values">{{ "UOM" }}</span>

        <span class="summary-values">{{ this.uom?.longName }}</span>

        <span class="summary-values">{{ this.uom?.name.split(" ")[0] }}</span>

        <span class="summary-values">{{
            this.uom?._imperial.weightValue +
                " " +
                this.imperialUnits.get("weightUnit")
        }}</span>

        <span class="summary-values">{{
            this.uom?._metric.volumeValue +
                " " +
                this.metricUnits.get("volumeUnit")
        }}</span>
    </div>

    <app-form
        id="main-form"
        [formData]="formData"
        [editingEnabled]="editingEnabled"
        [model]="uom"
        [excluded]="excluded"
        (onModelChange)="onFormModelChange($event)"
    >
        <!-- projection -->
        <ui5-form-item inFirstFormGroup>
            <ui5-label for="classInp" slot="labelContent" required="true">
                Class:
            </ui5-label>

            <ui5-select id="classInp" [value]="classInp" [disabled]="true">
                <ui5-option value="{{ classInp }}">{{ classInp }}</ui5-option>
            </ui5-select>
        </ui5-form-item>
    </app-form>

    <div id="table-sec">
        <app-tab
            [tabs]="tabs"
            (onTabChange)="selectTab($event)"
            [excluded]="tabsToExclude"
        ></app-tab>

        <!-- UOM Imperial and Metric Table -->
        <ng-container *ngIf="selectedTab == 'UOM Weight and Volume'">
            <app-tab
                [width]="'180px'"
                [tabs]="nestedTabs"
                (onTabChange)="selectNestedTab($event)"
            ></app-tab>

            <app-table
                *ngIf="selectedNestedTab == 'Metric'"
                [controlled]="true"
                [headers]="UOMMetricHeaders"
                [rows]="[this.uom._metric]"
                [keys]="UOMTableKeys"
                [editingEnabled]="
                    editingEnabled && env.enableMeasuredValuesInUOMDetails
                "
            ></app-table>

            <!-- Imperial Table -->
            <app-table
                *ngIf="selectedNestedTab == 'Imperial'"
                [controlled]="true"
                [headers]="UOMImperialHeaders"
                [rows]="[this.uom._imperial]"
                [keys]="UOMTableKeys"
                [editingEnabled]="
                    editingEnabled && env.enableMeasuredValuesInUOMDetails
                "
            ></app-table>
        </ng-container>

        <!-- Linked UOM Table -->
        <app-table
            [title]="'Linked UOM'"
            (onAddNewRow)="onNewLinkedUOMRow()"
            [controlled]="true"
            [enableAdd]="true"
            [enableDelete]="true"
            [headers]="LinkedUOM.headers"
            [rows]="uom._linkedUOMRows"
            [keys]="LinkedUOM.keys"
            [editingEnabled]="editingEnabled && env.enableLinkedUOMInUOMDetails"
            [paginated]="true"
            [paginatorProps]="paginatorProps"
            (onPaginationEvent)="handlePageEvent($event)"
            (onTableModelChange)="onLinkedUOMTableModelChange($event)"
            *ngIf="selectedTab == 'Linked UOM'"
        ></app-table>

        <!-- Linked PU and HU Table -->
        <app-table
            [title]="'Linked PU and HU'"
            (onAddNewRow)="onNewLinkedPUHURow()"
            [controlled]="true"
            [enableAdd]="true"
            [paginated]="true"
            [enableDelete]="true"
            [editingEnabled]="
                editingEnabled && env.enableLinkedPUandHuInUOMDetails
            "
            [headers]="LinkedPUAndHU.headers"
            [rows]="uom._linkedPUandHURows"
            [keys]="LinkedPUAndHU.keys"
            [paginatorProps]="paginatorProps"
            (onPaginationEvent)="handlePageEvent($event)"
            *ngIf="selectedTab == 'Linked PU and HU' && classInp == 'UOM'"
        ></app-table>

        <div id="buttons-sec">
            <app-form-actions
                (onSave)="onSave()"
                (onApprove)="onApprove()"
                (onCancel)="onCancel()"
                (onDelete)="onDelete()"
                [include]="['approve', 'cancel', 'save', 'delete']"
                [name]="'UOM'"
            ></app-form-actions>
        </div>
    </div>
</div>
