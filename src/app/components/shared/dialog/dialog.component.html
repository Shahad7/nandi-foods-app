<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
    {{ data.message }}
</mat-dialog-content>
<mat-dialog-actions>
    <button mat-button mat-dialog-close class="positive-btn">No</button>
    <button mat-button mat-dialog-close cdkFocusInitial class="negative-btn">
        Yes
    </button>
</mat-dialog-actions>
