<ui5-form layout=" S1 M2 L2 XL2" item-spacing="Large" style="width: 100%">
    <!-- Class -->

    <ui5-form-group>
        <ui5-form-item>
            <ui5-label for="classInp" slot="labelContent" required="true"
                >Class:</ui5-label
            >
            <ui5-select id="classInp" [(ngModel)]="classInp">
                <ui5-option value="UOM" selected>UOM</ui5-option>
                <ui5-option value="other1">Other 1</ui5-option>
                <ui5-option value="other2">Other 2</ui5-option>
            </ui5-select>
        </ui5-form-item>
        <!-- UOM Type -->
        <ui5-form-item>
            <ui5-label for="UOMTypeInp" slot="labelContent" required="true"
                >UOM Type:</ui5-label
            >
            <ui5-select id="UOMTypeInp" [(ngModel)]="UOMType">
                <ui5-option value="EACH" selected>EACH</ui5-option>
                <ui5-option value="other1">Other 1</ui5-option>
                <ui5-option value="other2">Other 2</ui5-option>
            </ui5-select>
        </ui5-form-item>
        <!-- UOM Description -->
        <ui5-form-item>
            <ui5-label
                for="UOMDescriptionInp"
                slot="labelContent"
                required="true"
                >UOM Description:</ui5-label
            >
            <ui5-input
                id="UOMDescriptionInp"
                [(ngModel)]="UOMDescription"
            ></ui5-input>
        </ui5-form-item>
        <!-- UOM Long Name -->
        <ui5-form-item>
            <ui5-label for="UOMLongNameInp" slot="labelContent" required="true"
                >UOM Long Name:</ui5-label
            >
            <ui5-input
                id="UOMLongNameInp"
                [(ngModel)]="UOMLongName"
            ></ui5-input>
        </ui5-form-item>
        <!-- Inventory UOM (Yes/No) -->
        <ui5-form-item>
            <ui5-label
                for="isInventoryUOMInp"
                slot="labelContent"
                required="true"
                >Inventory UOM:</ui5-label
            >
            <ui5-select id="isInventoryUOMInp" [(ngModel)]="isInventoryUOM">
                <ui5-option value="true" selected>Yes</ui5-option>
                <ui5-option value="false">No</ui5-option>
            </ui5-select>
        </ui5-form-item>
        <!-- Purchase UOM (Yes/No) -->
        <ui5-form-item>
            <ui5-label
                for="isPurchaseUOMInp"
                slot="labelContent"
                required="true"
                >Purchase UOM:</ui5-label
            >
            <ui5-select id="isPurchaseUOMInp" [(ngModel)]="isPurchaseUOM">
                <ui5-option value="true">Yes</ui5-option>
                <ui5-option value="false" selected>No</ui5-option>
            </ui5-select>
        </ui5-form-item>
    </ui5-form-group>
    <ui5-form-group>
        <!-- UOM Level -->
        <ui5-form-item>
            <ui5-label for="UOMLevelInp" slot="labelContent" required="true"
                >UOM Level:</ui5-label
            >
            <ui5-select id="UOMLevelInp" [(ngModel)]="UOMLevel">
                <ui5-option value="Level 1" selected>Level 1</ui5-option>
                <ui5-option value="Level 2">Level 2</ui5-option>
            </ui5-select>
        </ui5-form-item>
        <!-- UOM ID (Editable) -->
        <ui5-form-item>
            <ui5-label for="UOMIDInp" slot="labelContent" required="true"
                >UOM ID:</ui5-label
            >
            <ui5-input id="UOMIDInp" [(ngModel)]="UOMID"></ui5-input>
        </ui5-form-item>
        <!-- UOM Short Name (Editable) -->
        <ui5-form-item>
            <ui5-label for="UOMShortNameInp" slot="labelContent" required="true"
                >UOM Short Name:</ui5-label
            >
            <ui5-input
                id="UOMShortNameInp"
                [(ngModel)]="UOMShortName"
            ></ui5-input>
        </ui5-form-item>
        <!-- Production UOM (Yes/No) -->
        <ui5-form-item>
            <ui5-label
                for="isProductionUOMInp"
                slot="labelContent"
                required="true"
                >Production UOM:</ui5-label
            >
            <ui5-select id="isProductionUOMInp" [(ngModel)]="isProductionUOM">
                <ui5-option value="true" selected>Yes</ui5-option>
                <ui5-option value="false">No</ui5-option>
            </ui5-select>
        </ui5-form-item>
        <!-- Sales UOM (Yes/No) -->
        <ui5-form-item>
            <ui5-label for="isSalesUOMInp" slot="labelContent" required="true"
                >Sales UOM:</ui5-label
            >
            <ui5-select id="isSalesUOMInp" [(ngModel)]="isSalesUOM">
                <ui5-option value="true" selected>Yes</ui5-option>
                <ui5-option value="false">No</ui5-option>
            </ui5-select>
        </ui5-form-item>
    </ui5-form-group>

    <ui5-form-group>
        <!-- Read-only fields -->
        <!-- Date Created (Read-only) -->
        <ui5-form-item>
            <ui5-label for="DateCreatedInp" slot="labelContent"
                >Date Created:</ui5-label
            >
            <ui5-input
                id="DateCreatedInp"
                readonly
                value="{{ dateCreated }}"
            ></ui5-input>
        </ui5-form-item>
        <!-- Last Updated (Read-only) -->
        <ui5-form-item>
            <ui5-label for="LastUpdatedInp" slot="labelContent"
                >Last Updated:</ui5-label
            >
            <ui5-input
                id="LastUpdatedInp"
                readonly
                value="{{ lastUpdated }}"
            ></ui5-input>
        </ui5-form-item>
        <!-- Status (Read-only) -->
        <ui5-form-item>
            <ui5-label for="StatusInp" slot="labelContent">Status:</ui5-label>
            <ui5-input id="StatusInp" readonly value="{{ status }}"></ui5-input>
        </ui5-form-item>
    </ui5-form-group>

    <ui5-form-group>
        <!-- Effective Date (Read-only) -->
        <ui5-form-item>
            <ui5-label for="EffectiveDateInp" slot="labelContent"
                >Effective Date:</ui5-label
            >
            <ui5-input
                id="EffectiveDateInp"
                readonly
                value="{{ effectiveDate }}"
            ></ui5-input>
        </ui5-form-item>
        <!-- Last Updated by (Read-only) -->
        <ui5-form-item>
            <ui5-label for="LastUpdatedByInp" slot="labelContent"
                >Last Updated By:</ui5-label
            >
            <ui5-input
                id="LastUpdatedByInp"
                readonly
                value="{{ lastUpdatedBy }}"
            ></ui5-input>
        </ui5-form-item>
    </ui5-form-group>
</ui5-form>

<style>
    ui5-bar {
        box-shadow: none;
    }
</style>
