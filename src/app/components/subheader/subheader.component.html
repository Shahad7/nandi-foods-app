<div id="subheader">
    <img
        src="assets/menu.svg"
        alt=""
        id="sidebar-toggle-btn"
        (click)="onToggleSidebar()"
    />

    <ui5-title id="selected-option" level="H4">{{
        selectedOptionToDisplay
    }}</ui5-title>
    <div id="buttons-row">
        <ui5-button icon="edit" (click)="onEdit()" *ngIf="editButtonAdded"
            >Edit</ui5-button
        >
        <ui5-button icon="refresh" (ui5Click)="onRefresh()">Refresh</ui5-button>
    </div>
</div>
