root /usr/share/nginx/html;

server {

    listen 80;
    listen [::]:80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location ~ ^/([^/?&:'"]+)$ {
        try_files $uri @root_path;
    }

    location @root_path {
        rewrite ^/(.*)$ / break;
    }

    error_page 500 502 503 504 /50x.html;
    error_page 404 /;

    location = /50x.html {
        root /usr/share/nginx/html;
    }

}

